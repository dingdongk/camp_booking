# Development stack: `docker compose up` — code is mounted from each folder and reloads on save.
# Each service reads the .env in its own folder; there is no .env at the repo root.
# Production images are built from each service's Dockerfile when deploying.
name: vietcamp

include:
  # Supabase (Postgres, Auth, Storage, API gateway, Studio) — reads database/docker/.env
  - database/docker/docker-compose.yml

services:
  migrate:
    build: ./database
    env_file: ./database/.env
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: "no"

  backend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev:docker"
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules # Linux dependencies stay in the container, separate from Windows node_modules
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ai:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: sh -c "uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    env_file: ./ai/.env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      UV_LINK_MODE: copy
    volumes:
      - ./ai:/app
      - /app/.venv
      # gcloud application default credentials (Windows path; on macOS/Linux use ~/.config/gcloud)
      - ${APPDATA}/gcloud:/gcp:ro
    ports:
      - "8080:8080"

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
